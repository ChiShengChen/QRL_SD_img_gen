# UNet DDIM 模型配置
# @package model

name: "unet_ddim"
type: "diffusion"

# 模型參數
model_id: "runwayml/stable-diffusion-v1-5"
scheduler: "DDIMScheduler"
num_inference_steps: 50

# 生成配置
generation:
  guidance_scale: 7.5
  num_images_per_prompt: 1
  height: 512
  width: 512

# 設備配置
device: "cuda"
torch_dtype: "float16"

