[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrl_image_synthesis"
version = "0.1.0"
description = "Quantum Reinforcement Learning-Guided Image Synthesis via Hybrid Quantum-Classical Generative Model Architectures"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "QRL Team", email = "team@qrl-synthesis.org"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "diffusers>=0.30.0",
    "accelerate>=0.20.0",
    "transformers>=4.30.0",
    "safetensors>=0.3.0",
    "pennylane>=0.36.0",
    "pennylane-lightning>=0.36.0",
    "gymnasium>=0.29.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "einops>=0.6.0",
    "tqdm>=4.62.0",
    "lpips>=0.1.4",
    "pytorch-fid>=0.2.1",
    "pillow>=8.3.0",
    "opencv-python>=4.5.0",
    "open-clip-torch>=2.20.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.5.0",
    "h5py>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/qrl-team/qrl-image-synthesis"
Repository = "https://github.com/qrl-team/qrl-image-synthesis.git"
Documentation = "https://qrl-image-synthesis.readthedocs.io/"
"Bug Tracker" = "https://github.com/qrl-team/qrl-image-synthesis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qrl*", "scripts*", "tests*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["qrl", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
